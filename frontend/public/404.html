<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Dileep Kumar Panchumarthi</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
        background: #05060a; color: #e7e8f2;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        background-image: radial-gradient(circle at 20% 10%, rgba(124,58,237,.22), transparent 45%),
                          radial-gradient(circle at 85% 90%, rgba(34,211,238,.16), transparent 45%);
      }
      main { text-align: center; max-width: 28rem; }
      .code {
        font-family: Sora, system-ui, sans-serif; font-weight: 800; font-size: clamp(4rem, 18vw, 7rem);
        line-height: 1; margin: 0;
        background: linear-gradient(90deg, #7c3aed, #6366f1, #22d3ee);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      h1 { font-size: 1.5rem; margin: .75rem 0 .5rem; }
      p { color: #9ca3c0; margin: 0 0 1.75rem; line-height: 1.6; }
      a.btn {
        display: inline-block; padding: .7rem 1.5rem; border-radius: 999px; font-weight: 600; font-size: .9rem;
        color: #fff; text-decoration: none; background: linear-gradient(90deg, #7c3aed, #22d3ee);
      }
      a:focus-visible { outline: 2px solid #22d3ee; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or has moved.</p>
      <a class="btn" href="/">Back to the portfolio</a>
    </main>
  </body>
</html>
